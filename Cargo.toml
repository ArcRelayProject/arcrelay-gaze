[package]
name = "arcrelay-gaze"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Local-first gaze tracking and ArcRelay workspace targeting"
repository = "https://gitea.czbrcj.cn/ArcRelay/arcrelay-gaze"

[features]
default = ["camera"]
camera = ["dep:camera"]
demo = ["camera"]

[dependencies]
arcrelay-input = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-input.git", rev = "e15d533c462d8a0301c1954102246d3b36b56cea" }
camera = { optional = true, git = "https://gitea.czbrcj.cn/Medivh/camera-rs.git", rev = "c5b8ce3f1237a5334ceb3f5d8257067c0a12c5ed" }
image = { version = "0.25", default-features = false }
imageproc = "0.25"
mnn-runtime = { git = "https://github.com/zibo-chen/mnn-runtime-rs", rev = "2d88f779744a9029859743db9a55b5d00a2622c8" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[[example]]
name = "egui_demo"
required-features = ["demo"]

[dev-dependencies]
eframe = "0.33"
serde_json = "1"
