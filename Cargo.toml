[package]
name = "arcrelay-gaze"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-only"
publish = false
description = "Local-first gaze tracking and ArcRelay workspace targeting"
repository = "https://github.com/ArcRelayProject/arcrelay-gaze"

[features]
default = ["camera"]
camera = ["dep:camera"]
demo = ["camera"]

[dependencies]
arcrelay-input = { version = "0.1.0", git = "https://github.com/ArcRelayProject/arcrelay-input.git", rev = "63ece7b899e1854ee38b94d8c6f062efdbf23fbb" }
image = { version = "0.25", default-features = false }
imageproc = "0.25"
mnn-runtime = { git = "https://github.com/zibo-chen/mnn-runtime-rs", rev = "2d88f779744a9029859743db9a55b5d00a2622c8" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
camera = { package = "camera-rs", version = "0.5.1", optional = true, default-features = false, features = ["backend-avfoundation", "convert-rgb"] }

[target.'cfg(target_os = "windows")'.dependencies]
camera = { package = "camera-rs", version = "0.5.1", optional = true, default-features = false, features = ["backend-mf", "decode-mjpeg"] }

[target.'cfg(target_os = "linux")'.dependencies]
camera = { package = "camera-rs", version = "0.5.1", optional = true, default-features = false, features = ["backend-v4l2", "decode-mjpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
camera = { package = "camera-rs", version = "0.5.1", optional = true, default-features = false, features = ["backend-camera2", "convert-rgb"] }

[[example]]
name = "egui_demo"
required-features = ["demo"]

[dev-dependencies]
eframe = "0.33"
serde_json = "1"
